<!doctype html><html><body style="margin:0;background:#000"><script type="module">
// Dev viewer for the creature GLBs (not part of the game). Copy to the repo root and `npm run dev`, then open
// /viewer.html?glb=/_tmp/dune_stinger_lod0.glb&night=1&pose=curve|strike&a=0.8&d=3&h=1.2   (a: angle, d: distance, h: camera height)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const night = q.get('night') === '1', pose = q.get('pose') || 'rest';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1200, 800); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = night ? 0.5 : 0.9;
const scene = new THREE.Scene(); scene.background = new THREE.Color(night ? 0x02030a : 0x9fc3e0);
const cam = new THREE.PerspectiveCamera(40, 1.5, 0.05, 50);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0xc89a5a, roughness: 1 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
if (night) { const fire = new THREE.PointLight(0xff8833, 6, 8, 1.5); fire.position.set(1.2, 0.5, 1.0); scene.add(fire); scene.add(new THREE.HemisphereLight(0x223355, 0x000000, 0.35)); }
else { scene.add(new THREE.HemisphereLight(0xffffff, 0x886644, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 2); scene.add(d); }
const glowBoost = Number(q.get('glow') || 1); // the game scales Glow by itself; this mimics that
new GLTFLoader().load(q.get('glb') || '/_tmp/dune_stinger_lod0.glb', g => {
  const root = g.scene; scene.add(root);
  const bones = {}; root.traverse(o => { if (o.isBone) bones[o.name] = o; if (o.isSkinnedMesh) o.frustumCulled = false; if (o.material && o.material.name === 'Glow') o.material.emissiveIntensity = glowBoost; });
  const names = Object.keys(bones);
  const rot = (n, x, y, z) => { if (bones[n]) bones[n].rotation.set(x, y, z); };
  if (pose === 'curve') {
    for (let i = 1; i <= 8; i++) rot('Seg0' + i, 0, Math.sin(i * 0.9) * 0.28, 0);
    ['Tail1','Tail2','Tail3','Tail4'].forEach(n => rot(n, 0.5, 0, 0)); rot('Stinger', 0.6, 0, 0);
  }
  if (pose === 'strike') {
    ['Tail1','Tail2','Tail3','Tail4'].forEach(n => rot(n, 0.7, 0, 0)); rot('Stinger', 0.8, 0, 0);
    for (let i = 1; i <= 8; i++) rot('Seg0' + i, -0.08, 0, 0);
    names.filter(n => /^Leg\d+_[LR]_Upper$/.test(n)).forEach((n, k) => rot(n, Math.sin(k) * 0.5, 0, 0));
  }
  scene.updateMatrixWorld(true);
  const dist = Number(q.get('d') || 3), a = Number(q.get('a') || 0.8);
  cam.position.set(Math.sin(a) * dist, Number(q.get('h') || 1.2), Math.cos(a) * dist); cam.lookAt(0, 0.25, 0);
  r.render(scene, cam); document.title = 'done ' + names.length;
});
</script></body></html>
